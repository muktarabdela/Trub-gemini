name: Build Turab Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp index.html www/index.html
      - name: Install Capacitor
        run: |
          npm install @capacitor/core@^8 @capacitor/cli@^8 @capacitor/android@^8
      - name: Create Android Project
        run: |
          npx cap init Turab com.turab.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Generate Native Widget with Existing Milestone Icons
        run: |
          python3 <<'PY'
          from pathlib import Path
          base = Path("android/app/src/main")
          java, layout, drawable, xml = [base / p for p in (
              "java/com/turab/app", "res/layout", "res/drawable", "res/xml")]
          for folder in (java, layout, drawable, xml):
              folder.mkdir(parents=True, exist_ok=True)

          (java / "TurabWidgetBridge.java").write_text("""package com.turab.app;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.webkit.JavascriptInterface;
          public class TurabWidgetBridge {
              private final Context context;
              public TurabWidgetBridge(Context c) { context = c.getApplicationContext(); }
              @JavascriptInterface public void update(String startDate, int bestStreak, int currentStreak, String milestoneIcon) {
                  SharedPreferences p = context.getSharedPreferences("TurabWidgetData", Context.MODE_PRIVATE);
                  p.edit().putString("startDate", startDate).putInt("bestStreak", bestStreak)
                      .putInt("syncedStreak", currentStreak).putString("milestoneIcon", milestoneIcon).apply();
                  TurabWidgetProvider.updateAll(context);
              }
          }""")

          (java / "TurabWidgetProvider.java").write_text("""package com.turab.app;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          public class TurabWidgetProvider extends AppWidgetProvider {
              @Override public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
                  for (int id : ids) TurabWidgetHelper.updateWidget(c, m, id);
              }
              public static void updateAll(Context c) {
                  AppWidgetManager m = AppWidgetManager.getInstance(c);
                  ComponentName n = new ComponentName(c, TurabWidgetProvider.class);
                  for (int id : m.getAppWidgetIds(n)) TurabWidgetHelper.updateWidget(c, m, id);
              }
          }""")

          (java / "TurabWidgetHelper.java").write_text("""package com.turab.app;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.widget.RemoteViews;
          import java.util.Calendar;
          import java.util.TimeZone;
          public class TurabWidgetHelper {
              public static void updateWidget(Context c, AppWidgetManager m, int id) {
                  SharedPreferences p = c.getSharedPreferences("TurabWidgetData", Context.MODE_PRIVATE);
                  int streak = calculateStreak(p.getString("startDate", ""));
                  RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.turab_widget);
                  v.setTextViewText(R.id.widget_streak, "🔥 " + streak);
                  v.setTextViewText(R.id.widget_message, "Don't let it break!");
                  String htmlIcon = p.getString("milestoneIcon", "");
                  String icon = p.getInt("syncedStreak", -1) == streak && !htmlIcon.isEmpty()
                      ? htmlIcon : milestoneIconForStreak(streak);
                  v.setTextViewText(R.id.widget_milestone_icon, icon);
                  Intent launch = c.getPackageManager().getLaunchIntentForPackage(c.getPackageName());
                  if (launch != null) {
                      PendingIntent pi = PendingIntent.getActivity(c, 0, launch,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      v.setOnClickPendingIntent(R.id.widget_root, pi);
                  }
                  m.updateAppWidget(id, v);
              }
              // These are the exact milestone icons defined in index.html.
              private static String milestoneIconForStreak(int d) {
                  if (d >= 365) return "🌟";
                  if (d >= 100) return "🔥";
                  if (d >= 60) return "👑";
                  if (d >= 30) return "⚔️";
                  if (d >= 14) return "🗡️";
                  if (d >= 7) return "🛡️";
                  if (d >= 3) return "⚡";
                  return "🌱";
              }
              // Calendar days: start date is Day 1; phone-local midnight advances the count.
              private static int calculateStreak(String s) {
                  try {
                      String[] p = s.split("-");
                      Calendar a = Calendar.getInstance(TimeZone.getTimeZone("UTC"));
                      a.clear();
                      a.set(Integer.parseInt(p[0]), Integer.parseInt(p[1])-1, Integer.parseInt(p[2]));
                      Calendar local = Calendar.getInstance();
                      Calendar b = Calendar.getInstance(TimeZone.getTimeZone("UTC"));
                      b.clear();
                      b.set(local.get(Calendar.YEAR), local.get(Calendar.MONTH), local.get(Calendar.DAY_OF_MONTH));
                      long x = a.getTimeInMillis()/86400000L, y = b.getTimeInMillis()/86400000L;
                      return Math.max(1, (int)(y-x)+1);
                  } catch (Exception e) { return 1; }
              }
          }""")

          (layout / "turab_widget.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="top|center_horizontal"
              android:paddingTop="12dp"
              android:paddingBottom="6dp"
              android:paddingLeft="12dp"
              android:paddingRight="12dp"
              android:background="@drawable/turab_widget_background">

              <TextView
                  android:id="@+id/widget_streak"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:gravity="center"
                  android:includeFontPadding="false"
                  android:text="🔥 1"
                  android:textColor="#FFF0C7"
                  android:textStyle="bold"
                  android:textSize="32sp" />

              <TextView
                  android:id="@+id/widget_message"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="2dp"
                  android:gravity="center"
                  android:includeFontPadding="false"
                  android:text="Don't let it break!"
                  android:textColor="#FFE0A0"
                  android:textSize="12sp"
                  android:textStyle="bold" />

              <TextView
                  android:id="@+id/widget_milestone_icon"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:layout_marginTop="2dp"
                  android:gravity="center"
                  android:textAlignment="center"
                  android:includeFontPadding="false"
                  android:maxLines="1"
                  android:text="🌱"
                  android:textSize="96sp"
                  android:contentDescription="Current milestone icon" />
          </LinearLayout>""")

          (drawable / "turab_widget_background.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
                  android:angle="270"
                  android:startColor="#D86A12"
                  android:centerColor="#B9380D"
                  android:endColor="#98180F"/>
              <corners android:radius="24dp"/>
              <stroke android:width="1.5dp" android:color="#E6A34A"/>
          </shape>""")

          (xml / "turab_widget_info.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="140dp"
              android:minHeight="140dp"
              android:minResizeWidth="110dp"
              android:minResizeHeight="110dp"
              android:targetCellWidth="2"
              android:targetCellHeight="2"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/turab_widget"
              android:resizeMode="none"
              android:widgetCategory="home_screen"/>""")

          manifest = base / "AndroidManifest.xml"
          text = manifest.read_text()
          receiver = """<receiver android:name=".TurabWidgetProvider" android:label="Streak" android:exported="true">
              <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter>
              <meta-data android:name="android.appwidget.provider" android:resource="@xml/turab_widget_info"/>
          </receiver>"""
          if "TurabWidgetProvider" not in text:
              text = text.replace("</application>", receiver + "\n</application>")
          manifest.write_text(text)

          (java / "MainActivity.java").write_text("""package com.turab.app;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getBridge().getWebView().addJavascriptInterface(new TurabWidgetBridge(this), "TurabWidgetNative");
              }
          }""")
          print("Generated the native widget using the eight existing HTML milestone icons.")
          PY

      - name: Connect Turab App to Widget
        run: |
          python3 <<'PY'
          from pathlib import Path
          file = Path("www/index.html")
          html = file.read_text()
          function = "\n".join([
              "// Sync streak data to the Android home-screen widget.",
              "function syncTurabWidget(currentStreak) {",
              "    try {",
              "        if (window.TurabWidgetNative) {",
              "            const milestone = [...MILESTONES].reverse().find(item => item.day <= currentStreak) || MILESTONES[0];",
              "            window.TurabWidgetNative.update(appState.startDate, Number(appState.bestStreak || 1), currentStreak, milestone.icon);",
              "        }",
              "    } catch (error) { console.log('Turab widget sync:', error); }",
              "}",
              ""
          ])
          marker = "        // Render UI"
          if "function syncTurabWidget" not in html:
              if marker not in html: raise SystemExit("Could not find Render UI marker in index.html.")
              html = html.replace(marker, function + marker, 1)
          marker2 = "            // Text elements"
          if "syncTurabWidget(currentStreak);" not in html:
              if marker2 not in html: raise SystemExit("Could not find Text elements marker in index.html.")
              html = html.replace(marker2, "            syncTurabWidget(currentStreak);\n\n" + marker2, 1)
          file.write_text(html)
          print("Widget synchronization connected.")
          PY

      - name: Update Gradle Wrapper
        run: |
          sed -i 's|^distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-all.zip|' android/gradle/wrapper/gradle-wrapper.properties

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Turab-Duolingo-Style-Widget-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

