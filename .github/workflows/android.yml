
name: Build Turab Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@^8 @capacitor/cli@^8 @capacitor/android@^8

      - name: Create Android Project
        run: |
          npx cap init Turab com.turab.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Create Native Turab Widget
        run: |
          BASE="android/app/src/main"
          JAVA="$BASE/java/com/turab/app"
          mkdir -p "$JAVA"
          mkdir -p "$BASE/res/layout"
          mkdir -p "$BASE/res/xml"
          mkdir -p "$BASE/res/drawable"

          cat > "$JAVA/TurabWidgetBridge.java" <<'EOF'
          package com.turab.app;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.webkit.JavascriptInterface;

          public class TurabWidgetBridge {
              private final Context context;

              public TurabWidgetBridge(Context context) {
                  this.context = context.getApplicationContext();
              }

              @JavascriptInterface
              public void update(String startDate, int bestStreak) {
                  SharedPreferences prefs = context.getSharedPreferences(
                      "TurabWidgetData", Context.MODE_PRIVATE
                  );

                  prefs.edit()
                      .putString("startDate", startDate)
                      .putInt("bestStreak", bestStreak)
                      .apply();

                  TurabWidgetProvider.updateAll(context);
              }
          }
          EOF

          cat > "$JAVA/TurabWidgetProvider.java" <<'EOF'
          package com.turab.app;

          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;

          public class TurabWidgetProvider extends AppWidgetProvider {

              @Override
              public void onUpdate(
                  Context context,
                  AppWidgetManager manager,
                  int[] widgetIds
              ) {
                  for (int id : widgetIds) {
                      TurabWidgetHelper.updateWidget(context, manager, id);
                  }
              }

              public static void updateAll(Context context) {
                  AppWidgetManager manager =
                      AppWidgetManager.getInstance(context);

                  ComponentName component = new ComponentName(
                      context, TurabWidgetProvider.class
                  );

                  int[] ids = manager.getAppWidgetIds(component);

                  for (int id : ids) {
                      TurabWidgetHelper.updateWidget(context, manager, id);
                  }
              }
          }
          EOF

          cat > "$JAVA/TurabWidgetHelper.java" <<'EOF'
          package com.turab.app;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.widget.RemoteViews;

          import java.util.Calendar;
          import java.util.GregorianCalendar;
          import java.util.TimeZone;

          public class TurabWidgetHelper {

              public static void updateWidget(
                  Context context,
                  AppWidgetManager manager,
                  int widgetId
              ) {
                  SharedPreferences prefs = context.getSharedPreferences(
                      "TurabWidgetData", Context.MODE_PRIVATE
                  );

                  String startDate = prefs.getString("startDate", "");
                  int bestStreak = prefs.getInt("bestStreak", 1);
                  int currentStreak = calculateStreak(startDate);

                  RemoteViews views = new RemoteViews(
                      context.getPackageName(),
                      R.layout.turab_widget
                  );

                  views.setTextViewText(
                      R.id.widget_day,
                      "DAY " + currentStreak
                  );

                  views.setTextViewText(
                      R.id.widget_best,
                      "PERSONAL BEST: " + Math.max(bestStreak, currentStreak)
                  );

                  Intent launchIntent = context.getPackageManager()
                      .getLaunchIntentForPackage(context.getPackageName());

                  if (launchIntent != null) {
                      PendingIntent pendingIntent = PendingIntent.getActivity(
                          context,
                          0,
                          launchIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT |
                          PendingIntent.FLAG_IMMUTABLE
                      );

                      views.setOnClickPendingIntent(
                          R.id.widget_root, pendingIntent
                      );
                  }

                  manager.updateAppWidget(widgetId, views);
              }

              private static int calculateStreak(String startDate) {
                  try {
                      String[] parts = startDate.split("-");

                      int year = Integer.parseInt(parts[0]);
                      int month = Integer.parseInt(parts[1]);
                      int day = Integer.parseInt(parts[2]);

                      Calendar start = new GregorianCalendar(
                          TimeZone.getTimeZone("UTC")
                      );
                      start.clear();
                      start.set(year, month - 1, day);

                      Calendar localToday = Calendar.getInstance();

                      Calendar today = new GregorianCalendar(
                          TimeZone.getTimeZone("UTC")
                      );
                      today.clear();
                      today.set(
                          localToday.get(Calendar.YEAR),
                          localToday.get(Calendar.MONTH),
                          localToday.get(Calendar.DAY_OF_MONTH)
                      );

                      long difference =
                          (today.getTimeInMillis() -
                          start.getTimeInMillis()) / 86400000L;

                      return Math.max(1, (int) difference + 1);

                  } catch (Exception e) {
                      return 1;
                  }
              }
          }
          EOF

          cat > "$BASE/res/layout/turab_widget.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="8dp"
              android:background="@drawable/turab_widget_background">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center"
                  android:padding="2dp">

                  <TextView
                      android:layout_width="42dp"
                      android:layout_height="42dp"
                      android:gravity="center"
                      android:text="🐻"
                      android:textSize="30sp" />

                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:layout_marginStart="7dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="TURAB"
                          android:textColor="#F5EBE0"
                          android:textStyle="bold"
                          android:textSize="11sp" />

                      <TextView
                          android:id="@+id/widget_day"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="DAY 1"
                          android:textColor="#D4AF37"
                          android:textStyle="bold"
                          android:textSize="22sp" />

                      <TextView
                          android:id="@+id/widget_best"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="PERSONAL BEST: 1"
                          android:textColor="#8C8275"
                          android:textSize="9sp" />
                  </LinearLayout>
              </LinearLayout>
          </LinearLayout>
          EOF

          cat > "$BASE/res/drawable/turab_widget_background.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#1E1B18"/>
              <corners android:radius="18dp"/>
              <stroke
                  android:width="1dp"
                  android:color="#D4AF37"/>
          </shape>
          EOF

          cat > "$BASE/res/xml/turab_widget_info.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="110dp"
              android:minHeight="110dp"
              android:minResizeWidth="110dp"
              android:minResizeHeight="110dp"
              android:targetCellWidth="2"
              android:targetCellHeight="2"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/turab_widget"
              android:resizeMode="none"
              android:widgetCategory="home_screen"/>
          EOF

      - name: Register Native Widget and JavaScript Bridge
        run: |
          python3 <<'PY'
          from pathlib import Path

          base = Path("android/app/src/main")
          manifest = base / "AndroidManifest.xml"
          content = manifest.read_text()

          receiver_lines = [
              '    <receiver',
              '        android:name=".TurabWidgetProvider"',
              '        android:label="Turab"',
              '        android:exported="true">',
              '        <intent-filter>',
              '            <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>',
              '        </intent-filter>',
              '        <meta-data',
              '            android:name="android.appwidget.provider"',
              '            android:resource="@xml/turab_widget_info"/>',
              '    </receiver>'
          ]
          receiver = "\n".join(receiver_lines)

          if "TurabWidgetProvider" not in content:
              content = content.replace(
                  "</application>",
                  receiver + "\n</application>"
              )
          manifest.write_text(content)

          activity = base / "java/com/turab/app/MainActivity.java"
          activity_lines = [
              "package com.turab.app;",
              "",
              "import android.os.Bundle;",
              "import com.getcapacitor.BridgeActivity;",
              "",
              "public class MainActivity extends BridgeActivity {",
              "    @Override",
              "    public void onCreate(Bundle savedInstanceState) {",
              "        super.onCreate(savedInstanceState);",
              "        getBridge().getWebView().addJavascriptInterface(",
              "            new TurabWidgetBridge(this),",
              '            "TurabWidgetNative"',
              "        );",
              "    }",
              "}"
          ]
          activity.write_text("\n".join(activity_lines) + "\n")
          print("Native widget and JavaScript bridge registered.")
          PY

      - name: Connect Turab App to Widget
        run: |
          python3 <<'PY'
          from pathlib import Path

          file = Path("www/index.html")
          html = file.read_text()

          function = """
          // Synchronize Turab data with the Android home-screen widget
          function syncTurabWidget(currentStreak) {
              try {
                  if (window.TurabWidgetNative) {
                      window.TurabWidgetNative.update(
                          appState.startDate,
                          Number(appState.bestStreak || 1)
                      );
                  }
              } catch (error) {
                  console.log('Turab widget sync:', error);
              }
          }

          """

          marker = "        // Render UI"
          if "function syncTurabWidget" not in html:
              if marker not in html:
                  raise SystemExit("Could not find 'Render UI' marker in index.html.")
              html = html.replace(marker, function + marker, 1)

          marker2 = "            // Text elements"
          if "syncTurabWidget(currentStreak);" not in html:
              if marker2 not in html:
                  raise SystemExit("Could not find 'Text elements' marker in index.html.")
              html = html.replace(
                  marker2,
                  "            syncTurabWidget(currentStreak);\n\n" + marker2,
                  1
              )

          file.write_text(html)
          print("Turab widget synchronization connected.")
          PY

      - name: Update Gradle Wrapper
        run: |
          sed -i 's|^distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-all.zip|' android/gradle/wrapper/gradle-wrapper.properties

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Turab-Compact-Widget-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
